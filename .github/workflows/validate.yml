name: Validar Skills

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: Validação estrutural das skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar SKILL.md e contagem do catálogo
        run: python3 scripts/validate_skills.py

      # Informativo: reporta avisos do shellcheck sem bloquear o merge.
      # Promova para gate obrigatório depois de zerar os avisos do install.sh.
      - name: ShellCheck no install.sh (informativo)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh
