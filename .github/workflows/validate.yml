name: Validar Skills

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: Validação estrutural das skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Validar SKILL.md e contagem do catálogo
        run: python3 scripts/validate_skills.py

      - name: Checar referências de documentação
        run: python3 scripts/check_doc_refs.py

      - name: ShellCheck (gate obrigatório)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh scripts/*.sh

  smoke-install:
    name: Smoke test do install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Executar install.sh contra HOME temporário
        run: bash scripts/smoke_install.sh

  lint-docs:
    name: Lint de documentação (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Informativo: estilo de markdown na documentação curada.
      - name: markdownlint
        continue-on-error: true
        run: npx --yes markdownlint-cli2 "README.md" "CLAUDE.md" "CONTRIBUTING.md" "commands/*.md"

      # Informativo: liveness de links externos (http/https). Não checa
      # caminhos relativos (esses são cobertos por check_doc_refs.py).
      - name: Links externos (lychee)
        continue-on-error: true
        uses: lycheeverse/lychee-action@f81b5632d819bfa9954e0c8b1df7e4a1da27f510  # v2.3.0
        with:
          args: "--scheme https --scheme http --no-progress ./**/*.md"
          fail: false
